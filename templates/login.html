<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pablo Rail | ورود به مدیریت</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; }
.vodi-glass {
    background: rgba(17, 24, 39, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">

<div class="w-full max-w-md vodi-glass p-8 rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
        <div class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg shadow-cyan-500/30">
            <i class="fa-solid fa-train-subway text-white"></i>
        </div>
        <h1 class="text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
            Pablo Rail
        </h1>
        <p class="text-xs text-slate-400">پنل مدیریت هوشمند ترافیک و کاربران</p>
    </div>

    {% if error %}
    <div class="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-400 text-center">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">نام کاربری:</label>
            <div class="relative">
                <i class="fa-solid fa-user absolute right-3.5 top-3.5 text-slate-500 text-sm"></i>
                <input type="text" name="username" required
                    class="w-full pr-10 pl-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm focus:outline-none focus:border-cyan-400 text-slate-200 transition">
            </div>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">رمز عبور:</label>
            <div class="relative">
                <i class="fa-solid fa-lock absolute right-3.5 top-3.5 text-slate-500 text-sm"></i>
                <input type="password" name="password" required
                    class="w-full pr-10 pl-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm focus:outline-none focus:border-cyan-400 text-slate-200 transition">
            </div>
        </div>
        <button type="submit"
            class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/25 transition duration-200">
            ورود به پنل مدیریت
        </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-800">
        <span class="text-[11px] text-slate-500">
            ساخته شده توسط <strong class="text-cyan-400 font-bold">Abolfazl Pablo</strong> ❤️
        </span>
    </div>
</div>

</body>
</html>
