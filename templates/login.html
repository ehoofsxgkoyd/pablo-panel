<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pablo Rail | ورود</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn', sans-serif; }
body { background:#0b0f19; color:#f1f5f9; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.card { background:#111827; border:1px solid #1f2937; border-radius:24px; padding:32px 24px; width:100%; max-width:400px; box-shadow:0 20px 40px rgba(0,0,0,0.6); text-align:center; }
.logo { width:60px; height:60px; background:linear-gradient(135deg, #06b6d4, #2563eb); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 16px; box-shadow:0 8px 20px rgba(6,182,212,0.3); }
h1 { font-size:22px; font-weight:900; color:#fff; margin-bottom:4px; }
p { font-size:12px; color:#94a3b8; margin-bottom:24px; }
.form-group { text-align:right; margin-bottom:16px; }
label { display:block; font-size:12px; color:#cbd5e1; margin-bottom:6px; font-weight:600; }
input { width:100%; padding:12px 14px; background:#0b0f19; border:1px solid #374151; border-radius:12px; color:#fff; font-size:13px; outline:none; }
input:focus { border-color:#06b6d4; }
.btn { width:100%; padding:12px; background:linear-gradient(135deg, #06b6d4, #2563eb); border:none; border-radius:12px; color:#fff; font-size:14px; font-weight:800; cursor:pointer; margin-top:8px; box-shadow:0 4px 15px rgba(6,182,212,0.3); }
.error { background:rgba(244,63,94,0.15); border:1px solid rgba(244,63,94,0.3); color:#fb7185; padding:10px; border-radius:10px; font-size:12px; margin-bottom:16px; }
.footer { font-size:11px; color:#64748b; margin-top:24px; border-top:1px solid #1f2937; padding-top:14px; }
</style>
</head>
<body>
<div class="card">
    <div class="logo">🚆</div>
    <h1>Pablo Rail</h1>
    <p>پنل مدیریت هوشمند سرور و کاربران</p>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>نام کاربری:</label>
            <input type="text" name="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label>رمز عبور:</label>
            <input type="password" name="password" required autocomplete="off">
        </div>
        <button type="submit" class="btn">ورود به پنل مدیریت</button>
    </form>
    <div class="footer">ساخته شده توسط <b style="color:#38bdf8;">Abolfazl Pablo</b> ❤️</div>
</div>
</body>
</html>
