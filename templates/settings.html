<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>𝐒𝐞𝐭𝐭𝐢𝐧𝐠𝐬</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(0, 140, 255, .18), transparent 35%),
                radial-gradient(circle at bottom left, rgba(0, 80, 255, .12), transparent 35%),
                #050914;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: rgba(8, 15, 30, .92);
            border: 1px solid rgba(0, 153, 255, .35);
            border-radius: 24px;
            padding: 30px;
            box-shadow:
                0 0 35px rgba(0, 119, 255, .12),
                inset 0 0 25px rgba(0, 119, 255, .025);
            backdrop-filter: blur(15px);
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #8290a8;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aebbd0;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 1px solid #1d3150;
            outline: none;
            background: #08111f;
            color: #fff;
            padding: 0 15px;
            font-size: 15px;
            transition: .2s;
        }

        input:focus {
            border-color: #008cff;
            box-shadow: 0 0 15px rgba(0, 140, 255, .15);
        }

        .button {
            width: 100%;
            height: 53px;
            border: 0;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: 900;
            background: linear-gradient(135deg, #0077ff, #00b7ff);
            box-shadow: 0 8px 25px rgba(0, 130, 255, .2);
            transition: .2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 150, 255, .3);
        }

        .button:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #71819a;
            text-decoration: none;
            font-size: 13px;
            transition: .2s;
        }

        .back:hover {
            color: #00aaff;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 13px 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }

        .message.error {
            display: block;
            background: rgba(255, 45, 45, .1);
            border: 1px solid rgba(255, 45, 45, .3);
            color: #ff6b6b;
        }

        .message.success {
            display: block;
            background: rgba(0, 220, 130, .1);
            border: 1px solid rgba(0, 220, 130, .3);
            color: #00e68a;
        }

        .current {
            margin-bottom: 22px;
            padding: 13px 15px;
            background: rgba(0, 140, 255, .06);
            border: 1px solid rgba(0, 140, 255, .15);
            border-radius: 13px;
            color: #8494ad;
            font-size: 13px;
        }

        .current strong {
            color: #00aaff;
        }

        @media (max-width: 500px) {
            .card {
                padding: 23px 18px;
                border-radius: 20px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="title">𝐒𝐞𝐭𝐭𝐢𝐧𝐠𝐬</div>

        <div class="subtitle">
            𝐌𝐚𝐧𝐚𝐠𝐞 𝐲𝐨𝐮𝐫 𝐏𝐚𝐧𝐞𝐥 𝐥𝐨𝐠𝐢𝐧 𝐢𝐧𝐟𝐨𝐫𝐦𝐚𝐭𝐢𝐨𝐧
        </div>

        <div class="current">
            𝐂𝐮𝐫𝐫𝐞𝐧𝐭 𝐔𝐬𝐞𝐫𝐧𝐚𝐦𝐞:
            <strong>{{ current_username }}</strong>
        </div>

        <div id="message" class="message"></div>

        <form id="settingsForm">

            <div class="group">
                <label>𝐍𝐞𝐰 𝐔𝐬𝐞𝐫𝐧𝐚𝐦𝐞</label>

                <input
                    id="username"
                    type="text"
                    minlength="3"
                    autocomplete="username"
                    placeholder="𝐄𝐧𝐭𝐞𝐫 𝐧𝐞𝐰 𝐮𝐬𝐞𝐫𝐧𝐚𝐦𝐞"
                    value="{{ current_username }}"
                    required
                >
            </div>

            <div class="group">
                <label>𝐂𝐮𝐫𝐫𝐞𝐧𝐭 𝐏𝐚𝐬𝐬𝐰𝐨𝐫𝐝</label>

                <input
                    id="current_password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="𝐄𝐧𝐭𝐞𝐫 𝐜𝐮𝐫𝐫𝐞𝐧𝐭 𝐩𝐚𝐬𝐬𝐰𝐨𝐫𝐝"
                    required
                >
            </div>

            <div class="group">
                <label>𝐍𝐞𝐰 𝐏𝐚𝐬𝐬𝐰𝐨𝐫𝐝</label>

                <input
                    id="password"
                    type="password"
                    minlength="4"
                    autocomplete="new-password"
                    placeholder="𝐄𝐧𝐭𝐞𝐫 𝐧𝐞𝐰 𝐩𝐚𝐬𝐬𝐰𝐨𝐫𝐝"
                    required
                >
            </div>

            <div class="group">
                <label>𝐂𝐨𝐧𝐟𝐢𝐫𝐦 𝐍𝐞𝐰 𝐏𝐚𝐬𝐬𝐰𝐨𝐫𝐝</label>

                <input
                    id="confirm_password"
                    type="password"
                    minlength="4"
                    autocomplete="new-password"
                    placeholder="𝐂𝐨𝐧𝐟𝐢𝐫𝐦 𝐧𝐞𝐰 𝐩𝐚𝐬𝐬𝐰𝐨𝐫𝐝"
                    required
                >
            </div>

            <button
                id="saveButton"
                class="button"
                type="submit"
            >
                𝐒𝐚𝐯𝐞 𝐂𝐡𝐚𝐧𝐠𝐞𝐬
            </button>

        </form>

        <a class="back" href="/dashboard">
            𝐁𝐚𝐜𝐤 𝐭𝐨 𝐃𝐚𝐬𝐡𝐛𝐨𝐚𝐫𝐝
        </a>

    </div>

</div>

<script>

const form = document.getElementById("settingsForm");
const message = document.getElementById("message");
const button = document.getElementById("saveButton");

function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;

}

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const currentPassword =
        document.getElementById("current_password").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirm_password").value;


    if (username.length < 3) {

        showMessage(
            "𝐔𝐬𝐞𝐫𝐧𝐚𝐦𝐞 𝐦𝐮𝐬𝐭 𝐛𝐞 𝐚𝐭 𝐥𝐞𝐚𝐬𝐭 𝟑 𝐜𝐡𝐚𝐫𝐚𝐜𝐭𝐞𝐫𝐬",
            "error"
        );

        return;
    }


    if (password.length < 4) {

        showMessage(
            "𝐍𝐞𝐰 𝐩𝐚𝐬𝐬𝐰𝐨𝐫𝐝 𝐦𝐮𝐬𝐭 𝐛𝐞 𝐚𝐭 𝐥𝐞𝐚𝐬𝐭 𝟒 𝐜𝐡𝐚𝐫𝐚𝐜𝐭𝐞𝐫𝐬",
            "error"
        );

        return;
    }


    if (password !== confirmPassword) {

        showMessage(
            "𝐏𝐚𝐬𝐬𝐰𝐨𝐫𝐝𝐬 𝐝𝐨 𝐧𝐨𝐭 𝐦𝐚𝐭𝐜𝐡",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent = "𝐒𝐚𝐯𝐢𝐧𝐠...";


    try {

        const response = await fetch("/api/settings", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                username: username,

                password: password,

                current_password: currentPassword

            })

        });


        const data = await response.json();


        if (!response.ok || data.status !== "success") {

            showMessage(
                data.message || "𝐀𝐧 𝐞𝐫𝐫𝐨𝐫 𝐨𝐜𝐜𝐮𝐫𝐫𝐞𝐝",
                "error"
            );

            button.disabled = false;

            button.textContent = "𝐒𝐚𝐯𝐞 𝐂𝐡𝐚𝐧𝐠𝐞𝐬";

            return;
        }


        showMessage(
            "𝐒𝐚𝐯𝐞𝐝. 𝐑𝐞𝐝𝐢𝐫𝐞𝐜𝐭𝐢𝐧𝐠 𝐭𝐨 𝐥𝐨𝐠𝐢𝐧...",
            "success"
        );


        setTimeout(function() {

            window.location.href = "/login";

        }, 1200);


    } catch (error) {

        showMessage(
            "𝐂𝐨𝐧𝐧𝐞𝐜𝐭𝐢𝐨𝐧 𝐞𝐫𝐫𝐨𝐫. 𝐏𝐥𝐞𝐚𝐬𝐞 𝐭𝐫𝐲 𝐚𝐠𝐚𝐢𝐧.",
            "error"
        );

        button.disabled = false;

        button.textContent = "𝐒𝐚𝐯𝐞 𝐂𝐡𝐚𝐧𝐠𝐞𝐬";

    }

});

</script>

</body>
</html>
